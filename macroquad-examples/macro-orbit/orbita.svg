<svg width="500" height="400" viewBox="-250 -200 500 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo transparente -->
  <rect x="-250" y="-200" width="500" height="400" fill="none"/>
  
  <!-- Elipse de la órbita (línea punteada) -->
  <ellipse cx="0" cy="0" rx="180" ry="100" fill="none" 
           stroke="#666" stroke-width="2" stroke-dasharray="8,6"/>
  
  <!-- Centro de la órbita (punto rojo) -->
  <circle cx="0" cy="0" r="8" fill="red"/>
  
  <!-- Etiqueta del centro -->
  <text x="10" y="8" font-family="monospace" font-size="14" fill="red">Centro</text>
  
  <!-- Radio X (línea horizontal) -->
  <line x1="0" y1="0" x2="180" y2="0" stroke="blue" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="130" y="-8" font-family="monospace" font-size="12" fill="blue">radio_x = 180</text>
  
  <!-- Radio Y (línea vertical) -->
  <line x1="0" y1="0" x2="0" y2="-100" stroke="green" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="10" y="-110" font-family="monospace" font-size="12" fill="green">radio_y = 100</text>
  
  <!-- Focos de la elipse (puntos amarillos) -->
  <!-- Para una elipse con a=180, b=100, c = sqrt(180² - 100²) = sqrt(32400 - 10000) = sqrt(22400) ≈ 149.66 -->
  <circle cx="149.66" cy="0" r="5" fill="gold"/>
  <circle cx="-149.66" cy="0" r="5" fill="gold"/>
  
  <text x="155" y="-10" font-family="monospace" font-size="10" fill="gold">Foco</text>
  <text x="-180" y="-10" font-family="monospace" font-size="10" fill="gold">Foco</text>
  
  <!-- OBJETO ORBITANTE ANIMADO -->
  <!-- Se mueve siguiendo la elipse con la fórmula paramétrica:
       x = 180 * cos(θ), y = 100 * sin(θ)
       donde θ aumenta en el tiempo -->
  <circle cx="0" cy="0" r="18" fill="#2196F3" opacity="0.8">
    <animateMotion 
      dur="6s" 
      repeatCount="indefinite"
      path="M180,0 C180,-55 110,-100 0,-100 C-110,-100 -180,-55 -180,0 C-180,55 -110,100 0,100 C110,100 180,55 180,0 Z"/>
  </circle>
  
  <!-- Círculo interior del objeto (más oscuro para efecto 3D) -->
  <circle cx="0" cy="0" r="8" fill="#0D47A1" opacity="0.9">
    <animateMotion 
      dur="6s" 
      repeatCount="indefinite"
      path="M180,0 C180,-55 110,-100 0,-100 C-110,-100 -180,-55 -180,0 C-180,55 -110,100 0,100 C110,100 180,55 180,0 Z"/>
  </circle>
  
  <!-- Etiqueta del objeto -->
  <text x="-80" y="-40" font-family="monospace" font-size="12" fill="#2196F3" opacity="0.8">
    <animateMotion 
      dur="6s" 
      repeatCount="indefinite"
      path="M180,0 C180,-55 110,-100 0,-100 C-110,-100 -180,-55 -180,0 C-180,55 -110,100 0,100 C110,100 180,55 180,0 Z"/>
  </text>
  
  <!-- Leyenda -->
  <rect x="-240" y="150" width="480" height="30" rx="5" fill="#f5f5f5" stroke="#ccc"/>
  <text x="-220" y="170" font-family="monospace" font-size="11" fill="#333">
    🔵: Orbitante (sigue la elipse)  •  🔴: Centro  •  🟡: Focos
  </text>
</svg>